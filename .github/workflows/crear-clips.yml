name: Crear clips automáticos autorizados
run-name: Clip Forge ${{ inputs.job_key || 'limpieza' }}

on:
  workflow_dispatch:
    inputs:
      job_key:
        description: 'Identificador generado por el editor (32 caracteres hexadecimales)'
        type: string
        required: true
      video_url:
        description: 'Enlace HTTPS de un video PUBLICO que tengas derecho a reutilizar'
        type: string
        required: true
      clip_seconds:
        description: 'Duración de cada clip'
        type: choice
        required: true
        default: '30'
        options: ['15', '20', '30', '45', '60']
      authorized_public:
        description: 'Tengo permiso y acepto que los clips serán públicos hasta su eliminación automática (24-30 h)'
        type: boolean
        required: true
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: clip-forge-publicaciones
  cancel-in-progress: false

jobs:
  crear:
    if: github.event_name == 'workflow_dispatch' && inputs.authorized_public == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener el generador
        uses: actions/checkout@v4
      - name: Verificar identificador y autorización
        env:
          JOB_KEY: ${{ inputs.job_key }}
        run: |
          [[ "$JOB_KEY" =~ ^[a-f0-9]{32}$ ]] || { echo 'Identificador inválido'; exit 1; }
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar JavaScript para medios compatibles
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar FFmpeg y el procesador gratuito
        id: herramientas
        timeout-minutes: 6
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "::notice title=Clip Forge::Instalando FFmpeg con límite de tiempo"
            timeout -k 10s 90s sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            timeout -k 10s 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
          echo "FFmpeg y FFprobe listos"
          echo "::notice title=Clip Forge::Instalando procesador de videos"
          timeout -k 10s 90s python -m pip install --disable-pip-version-check --retries 2 --timeout 15 'yt-dlp[default]' 'requests>=2.32,<3'
      - name: Detectar momentos y exportar MP4 verticales
        if: steps.herramientas.outcome == 'success'
        id: procesar
        continue-on-error: true
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          CLIP_SECONDS: ${{ inputs.clip_seconds }}
        run: python procesar_clips.py
      - name: Publicar diagnóstico temporal de fallo
        if: steps.herramientas.outcome == 'failure' || steps.procesar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_KEY: ${{ inputs.job_key }}
        run: |
          if [[ "${{ steps.herramientas.outcome }}" == "failure" ]]; then
            codigo=TOOLS_INSTALL_FAILED
          else
            codigo=$(jq -r '.code // "PROCESSING_FAILED"' clips_generados/error.json 2>/dev/null || echo PROCESSING_FAILED)
          fi
          case "$codigo" in
            YOUTUBE_VERIFICATION|SOURCE_UNAVAILABLE|DOWNLOAD_FAILED|FFMPEG_MISSING|PROCESSING_FAILED|DIRECT_LINK_INVALID|DIRECT_DOWNLOAD_FAILED|DIRECT_TOO_LARGE|TOOLS_INSTALL_FAILED) ;;
            *) codigo=PROCESSING_FAILED ;;
          esac
          gh release create "clip-${JOB_KEY}" \
            --target "$GITHUB_SHA" \
            --title "Clip Forge | error" \
            --notes "CLIP_FORGE_ERROR:$codigo"
          echo "::error title=Clip Forge::$codigo"
          exit 1
      - name: Publicar clips temporales para el editor web
        if: steps.procesar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_KEY: ${{ inputs.job_key }}
        run: |
          [[ "$JOB_KEY" =~ ^[a-f0-9]{32}$ ]] || exit 1
          gh release create "clip-${JOB_KEY}" clips_generados/clip_*_vertical.mp4 clips_generados/recortes.json \
            --target "$GITHUB_SHA" \
            --title "Clip Forge | ${JOB_KEY}" \
            --notes "Recortes generados automáticamente para un video público autorizado. Revisar antes de publicar. Archivos públicos y temporales: se eliminan durante la limpieza posterior a 24 horas."
      - name: Respaldo temporal del trabajo (1 día)
        if: steps.procesar.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: clips-mp4-${{ inputs.job_key }}
          path: clips_generados/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  limpieza:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Eliminar exclusivamente clips generados hace más de 24 horas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          corte=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt | \
            jq -r --arg corte "$corte" '.[] | select(.tagName | test("^clip-[a-f0-9]{32}$")) | select(.publishedAt < $corte) | .tagName' | \
            while IFS= read -r etiqueta; do
              [[ "$etiqueta" =~ ^clip-[a-f0-9]{32}$ ]] || continue
              gh release delete "$etiqueta" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
