name: Prueba real del generador de clips

on:
  push:
    branches: [studio-pro]
    paths:
      - procesar_clips.py
      - .github/workflows/smoke-clips.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mp4-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar FFmpeg y requests
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Generar video de prueba con sonido (sin descargar contenido de terceros)
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=320x180:rate=12' \
            -f lavfi -i 'sine=frequency=440:sample_rate=16000' \
            -t 88 -c:v libx264 -preset ultrafast -crf 33 -pix_fmt yuv420p \
            -c:a aac -b:a 64k /tmp/clip-forge-source.mp4
      - name: Publicar video sintético temporal para probar enlaces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "clip-fixture-${GITHUB_RUN_ID}" /tmp/clip-forge-source.mp4 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Clip Forge fixture ${GITHUB_RUN_ID}" --notes "Video sintético de prueba; se eliminará al terminar."
      - name: Generar cinco clips MP4 verticales reales
        run: |
          python procesar_clips.py --archivo-local /tmp/clip-forge-source.mp4 --carpeta /tmp/clip-forge-smoke --duracion 15
          test "$(find /tmp/clip-forge-smoke -name 'clip_*_vertical.mp4' -type f | wc -l)" -eq 5
          for f in /tmp/clip-forge-smoke/clip_*_vertical.mp4; do
            test -s "$f"
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$f")
            test "$dims" = "720x1280"
            ffmpeg -v error -i "$f" -f null - </dev/null
          done
      - name: Conservar MP4 de prueba por un día
        uses: actions/upload-artifact@v4
        with:
          name: clip-forge-smoke-mp4
          path: /tmp/clip-forge-smoke/clip_*_vertical.mp4
          retention-days: 1
          compression-level: 0

  enlace-mp4-publico:
    needs: mp4-real
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias explícitas
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Descargar MP4 de muestra mediante enlace HTTPS y generar recortes
        env:
          VIDEO_URL: https://github.com/abcden/views/releases/download/clip-fixture-${{ github.run_id }}/clip-forge-source.mp4
          CLIP_SECONDS: '15'
        run: |
          set -euo pipefail
          python procesar_clips.py --carpeta /tmp/clip-forge-link-test
          test "$(find /tmp/clip-forge-link-test -name 'clip_*_vertical.mp4' -type f | wc -l)" -ge 1
          for f in /tmp/clip-forge-link-test/clip_*_vertical.mp4; do
            ffmpeg -v error -i "$f" -f null - </dev/null
          done
      - name: Eliminar exclusivamente el video sintético de esta ejecución
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "clip-fixture-${GITHUB_RUN_ID}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
